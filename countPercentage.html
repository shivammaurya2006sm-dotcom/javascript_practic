 <!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
  </head>
  <body>
       
      <script>
          let value=Number(prompt("Enter a numbe"));
      let marks=value;
        
        if(marks>600|| marks<0 || Number.isNaN(marks)){
          document.write("Plese re-enter your marks");
        }
         
        else{
          let grade=(marks/600)*100;
         let percentage=Number(grade.toFixed(2));
        if(percentage>=90){
          document.write("Excelent you have got "+percentage+"%");
        }
         
        else if(percentage>=80 && percentage<90){
        document.write("Very Good you have got "+percentage+"%");
        }
         
        else if(percentage>=60 && percentage<80){
        document.write("Good you have got "+percentage+"%")
        }
         
        else if(percentage>=33 && percentage<60){
        document.write("Pass you have got "+percentage+"%")
        }
         
        else{
          document.write("Fail you have got "+percentage+"%")
        }
        }
       
      </script>
  </body>
</html>
