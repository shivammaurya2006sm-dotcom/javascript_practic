<!DOCTYPE html>
<html>
    <head>
        <title>Checking  perfect square number</title>
    </head>
    <body>
    <script>

        function square(){
             var g=Number (prompt("Enter the a number-"))
            let a=g;
            let b=a**(1/2);
            if(a%b==0){
            document.write("it is a perfect square number");
            }
            else{
            document.write("it is not a perfect square number");
            }
        }
        square();
        </script>
    </body>  
    </html>
