 <!DOCTYPE html>
 <html>
    <head>
        <title>Multiplication of a number</title>
    </head>
    <body>
        <script>
     let num=5;
     let term=1;
     while(term<=10){
        let table=num*term;
        document.write("<div>"+ num  +" * "+ term +" = "+ table +"</div>");
        term++;
    }
    </script>
</body>
    </html>
