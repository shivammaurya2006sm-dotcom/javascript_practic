 background-color: rgb(193, 152, 245);

<body>
  <!-- <input id="pass" type="Number"> -->
    <h2 class="learn">Checking the number is prime or composit </h2>
    <script>
       var a=Number(prompt("Enter the a number-"))
  let num=a;
  let count=0
  
  for(let i=1; i<=num; i++){
    if(num % i==0){
      count++;
    }
        }
    if (count==2){
      document.write("the number is prime");
    }

    else{
  document.write("number is composit");
}

    </script>
